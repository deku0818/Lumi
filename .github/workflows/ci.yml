name: CI

# push / PR 到 main 时跑后端 lint + 测试，以及桌面端 TypeScript 类型检查。
# 三条发布流水线（PyPI / Docker / 桌面）经 workflow_call 复用本文件作为前置门：
# 测试不过不发版；tag 触发时再校验 tag 与 pyproject 版本一致（三方共用这一处）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  # PyPI 版本号用掉即不可重用，Docker tag 取 git tag、桌面版本取 pyproject——三者错位
  # 照样能发出去，故在发布前统一卡住
  version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag 与 pyproject version $pkg 不一致，拒绝发布"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv 按 pyproject 的 requires-python 自动下 Python，无需 setup-python
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # grep/glob 工具调 rg 二进制（不作 Python 依赖），测试需要真实 rg
      - run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: uv sync --all-groups --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .

      - run: uv run pytest -q

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
        working-directory: desktop

      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: desktop
